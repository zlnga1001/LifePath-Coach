version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: jobapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifepath
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: lifepathdb
    ports:
      - "15432:5432" # map host 15432 -> container 5432 to avoid conflicts
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./server/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifepath -d lifepathdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobapp-network

networks:
  jobapp-network:
    driver: bridge
